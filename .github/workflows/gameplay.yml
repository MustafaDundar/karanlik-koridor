name: Root 3D gameplay checks
on:
  pull_request:
    paths: ['scripts/**', 'scenes/**', 'shaders/**', 'tests/**', 'assets/**', 'production/review/**', 'project.godot', '.github/workflows/gameplay.yml']
  push:
    paths: ['scripts/**', 'scenes/**', 'shaders/**', 'tests/**', 'assets/**', 'production/review/**', 'project.godot', '.github/workflows/gameplay.yml']
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.3
        run: |
          curl -fLs https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 /tmp/godot
          chmod +x /tmp/godot
      - name: Import root project
        run: /tmp/godot --headless --path . --editor --import --quit
      - name: Gameplay regression checks
        run: /tmp/godot --headless --path . --script res://tests/gameplay.gd
