<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Karanlık Koridor</title><style>body{margin:0;background:#000;color:white;font:16px Arial;overflow:hidden}canvas{width:100vw;height:100vh;display:block}#ui{position:absolute;top:15px;left:15px;text-shadow:0 0 5px black}#start{position:absolute;inset:0;background:#080909ee;display:grid;place-content:center;text-align:center}button{padding:15px;background:#741b1b;color:white;border:0;border-radius:8px}#pad{position:absolute;bottom:15px;left:15px;display:flex;gap:8px}#pad button{opacity:.7}</style><canvas id="c"></canvas><div id="ui">🔦 Fener: <span id="b">100</span>%　🗝️ <span id="k">0</span>/3<br>WASD: yürü | Fare: bak | F: fener | Shift: koş</div><div id="pad"><button id="left">◀</button><button id="forward">▲</button><button id="back">▼</button><button id="right">▶</button><button id="torch">🔦</button></div><div id="start"><h1 style="color:#c22">KARANLIK KORİDOR</h1><p>Üç anahtarı bul. Yaratıktan kaç. Çıkışa ulaş.</p><button onclick="begin()">OYNA</button></div><script>
const c=document.getElementById('c'),g=c.getContext('2d'),M=['111111111111111','100000000000001','101110101110101','100010100010001','100000000000101','101011101010101','100010001000001','101010101011101','100000000000001','101110101110101','100000100000001','101010101011101','100000000000001','111111111111111'];let x=1.5,y=1.5,a=0,b=100,flash=true,keys=0,playing=false,enemy=[12.5,12.5],items=[[13.5,1.5],[1.5,12.5],[7.5,8.5]],pressed={},last=0;
function wall(X,Y){return M[Math.floor(Y)]?.[Math.floor(X)]!=='0'}function begin(){document.getElementById('start').style.display='none';x=1.5;y=1.5;a=0;b=100;keys=0;flash=true;enemy=[12.5,12.5];items=[[13.5,1.5],[1.5,12.5],[7.5,8.5]];playing=true;last=performance.now();requestAnimationFrame(loop)}
onkeydown=e=>{pressed[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='f')flash=!flash};onkeyup=e=>pressed[e.key.toLowerCase()]=false;c.onclick=()=>c.requestPointerLock?.();onmousemove=e=>{if(document.pointerLockElement===c)a+=e.movementX*.003};let tx=null;c.ontouchstart=e=>tx=e.touches[0].clientX;c.ontouchmove=e=>{if(tx!==null){a+=(e.touches[0].clientX-tx)*.008;tx=e.touches[0].clientX}};c.ontouchend=()=>tx=null;
for(const [id,key] of [['left','arrowleft'],['right','arrowright'],['forward','w'],['back','s']]){const q=document.getElementById(id);q.onpointerdown=e=>{pressed[key]=true;q.setPointerCapture(e.pointerId)};q.onpointerup=q.onpointercancel=()=>pressed[key]=false}document.getElementById('torch').onclick=()=>flash=!flash;
function end(msg){playing=false;document.exitPointerLock?.();const p=document.getElementById('start');p.style.display='grid';p.innerHTML='<h1>'+msg+'</h1><button onclick="begin()">TEKRAR OYNA</button>'}
function loop(t){if(!playing)return;const dt=Math.min(.05,(t-last)/1000);last=t;let speed=dt*(pressed.shift?3.5:2.2);if(pressed.arrowleft||pressed.a)a-=dt*2;if(pressed.arrowright||pressed.d)a+=dt*2;let v=(pressed.w||pressed.arrowup?1:0)-(pressed.s||pressed.arrowdown?1:0),nx=x+Math.cos(a)*v*speed,ny=y+Math.sin(a)*v*speed;if(!wall(nx,y))x=nx;if(!wall(x,ny))y=ny;if(flash){b=Math.max(0,b-dt*.6);if(!b)flash=false}else b=Math.min(100,b+dt*.8);items=items.filter(p=>{if(Math.hypot(x-p[0],y-p[1])<.55){keys++;return false}return true});if(keys===3&&Math.hypot(x-13.5,y-12.5)<.7)return end('KURTULDUN!');let d=Math.hypot(x-enemy[0],y-enemy[1]);if(d<8&&d>.01){let xx=enemy[0]+(x-enemy[0])/d*dt*.9,yy=enemy[1]+(y-enemy[1])/d*dt*.9;if(!wall(xx,enemy[1]))enemy[0]=xx;if(!wall(enemy[0],yy))enemy[1]=yy}if(d<.55)return end('SENİ BULDU!');render();document.getElementById('b').textContent=Math.round(b);document.getElementById('k').textContent=keys;requestAnimationFrame(loop)}
function render(){const W=c.width=innerWidth,H=c.height=innerHeight;g.fillStyle='#090d11';g.fillRect(0,0,W,H/2);g.fillStyle='#171411';g.fillRect(0,H/2,W,H/2);let depth=[];for(let i=0;i<W;i+=3){const angle=a+Math.atan((i/W-.5)*1.25);let d=0;while(d<19&&!wall(x+Math.cos(angle)*d,y+Math.sin(angle)*d))d+=.045;d*=Math.cos(angle-a);depth[Math.floor(i/3)]=d;let h=Math.min(H*2,H/Math.max(.15,d)),light=(flash?Math.max(.04,1-Math.abs(i/W-.5)*1.6):.07)/(1+d*.23),n=Math.floor(Math.min(140,140*light));g.fillStyle='rgb('+Math.floor(n*.7)+','+Math.floor(n*.85)+','+n+')';g.fillRect(i,H/2-h/2,4,h)}for(const [sx,sy,type] of [...items.map(p=>[...p,'key']),[13.5,12.5,'exit'],[...enemy,'monster']]){let d=Math.hypot(sx-x,sy-y),ang=Math.atan2(sy-y,sx-x)-a;ang=Math.atan2(Math.sin(ang),Math.cos(ang));if(Math.abs(ang)>.65||d<.1)continue;let screen=(.5+Math.tan(ang)/1.25)*W,h=Math.min(H*2,H/d*(type==='key'?.3:1));if(depth[Math.max(0,Math.min(depth.length-1,Math.floor(screen/3)))]<d-.3)continue;g.fillStyle=type==='key'?'#e4c34c':type==='monster'?'#100305':keys===3?'#43ad53':'#79312a';g.fillRect(screen-h*.15,H/2-h/2,h*.3,h);if(type==='monster'){g.fillStyle='#e22';g.fillRect(screen-h*.08,H/2-h*.27,h*.05,h*.02);g.fillRect(screen+h*.04,H/2-h*.27,h*.05,h*.02)}}let v=g.createRadialGradient(W/2,H/2,30,W/2,H/2,W*.7);v.addColorStop(0,'#0000');v.addColorStop(1,'#000e');g.fillStyle=v;g.fillRect(0,0,W,H)}
</script>
